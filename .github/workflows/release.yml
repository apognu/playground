name: Push

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify-local

      - uses: actions/setup-go@v7.1.0

